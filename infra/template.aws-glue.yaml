AWSTemplateFormatVersion: '2010-09-09'
Description: Production AWS Glue jobs and Glue Data Catalog namespaces for Financial Data Lakehouse.

Parameters:
  ProjectName:
    Type: String
    Default: financial-lakehouse
  RawBucketName:
    Type: String
    Description: Raw/lakehouse S3 bucket created by infra/template.yaml.
  ArtifactBucket:
    Type: String
    Description: Bucket holding Glue script entrypoints and lakehouse_src.zip.
  ArtifactPrefix:
    Type: String
    Default: financial-lakehouse-ingestion
  GlueJobRoleArn:
    Type: String
    Description: Glue execution role output from infra/template.yaml.
  IngestionFunctionName:
    Type: String
    Description: Lambda function name output from infra/template.yaml, used for CloudWatch alarms.
  SilverDatabase:
    Type: String
    Default: lakehouse_silver
  GoldDatabase:
    Type: String
    Default: lakehouse_gold
  GlueVersion:
    Type: String
    Default: '5.1'
    AllowedValues: ['5.0', '5.1', '6.0']
  NumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 10

Resources:
  SilverDatabaseResource:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref SilverDatabase
        Description: Financial Data Lakehouse Silver normalized data.

  GoldDatabaseResource:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GoldDatabase
        Description: Financial Data Lakehouse Gold dimensional warehouse and marts.

  BronzeToSilverJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-bronze-to-silver'
      Description: Validate, normalize and merge raw Bronze API envelopes into Silver Iceberg tables.
      Role: !Ref GlueJobRoleArn
      GlueVersion: !Ref GlueVersion
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ArtifactBucket}/${ArtifactPrefix}/glue_jobs/bronze_to_silver.py'
      ExecutionProperty:
        MaxConcurrentRuns: 3
      WorkerType: G.1X
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: 60
      MaxRetries: 1
      DefaultArguments:
        '--job-language': python
        '--datalake-formats': iceberg
        '--enable-glue-datacatalog': 'true'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--extra-py-files': !Sub 's3://${ArtifactBucket}/${ArtifactPrefix}/lakehouse_src.zip'
        '--bucket': !Ref RawBucketName
        '--warehouse': !Sub 's3://${RawBucketName}/warehouse/'
        '--catalog': glue_catalog
        '--silver-database': !Ref SilverDatabase
        '--gold-database': !Ref GoldDatabase
        '--reference-dir': !Sub 's3a://${RawBucketName}/reference'
        '--conf': !Sub 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://${RawBucketName}/warehouse/ --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO'
      Tags:
        Project: !Ref ProjectName
        Layer: Silver

  SilverToGoldJob:
    Type: AWS::Glue::Job
    DependsOn:
      - SilverDatabaseResource
      - GoldDatabaseResource
    Properties:
      Name: !Sub '${ProjectName}-silver-to-gold'
      Description: Build SCD2 dimensions, financial facts and Gold analytics marts.
      Role: !Ref GlueJobRoleArn
      GlueVersion: !Ref GlueVersion
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ArtifactBucket}/${ArtifactPrefix}/glue_jobs/silver_to_gold.py'
      ExecutionProperty:
        MaxConcurrentRuns: 1
      WorkerType: G.1X
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: 60
      MaxRetries: 1
      DefaultArguments:
        '--job-language': python
        '--datalake-formats': iceberg
        '--enable-glue-datacatalog': 'true'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--extra-py-files': !Sub 's3://${ArtifactBucket}/${ArtifactPrefix}/lakehouse_src.zip'
        '--bucket': !Ref RawBucketName
        '--warehouse': !Sub 's3://${RawBucketName}/warehouse/'
        '--catalog': glue_catalog
        '--silver-database': !Ref SilverDatabase
        '--gold-database': !Ref GoldDatabase
        '--reference-dir': !Sub 's3a://${RawBucketName}/reference'
        '--conf': !Sub 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://${RawBucketName}/warehouse/ --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO'
      Tags:
        Project: !Ref ProjectName
        Layer: Gold

  IcebergMaintenanceJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-iceberg-maintenance'
      Description: Compact Iceberg data files and expire snapshots using conservative retention.
      Role: !Ref GlueJobRoleArn
      GlueVersion: !Ref GlueVersion
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub 's3://${ArtifactBucket}/${ArtifactPrefix}/glue_jobs/table_maintenance.py'
      ExecutionProperty:
        MaxConcurrentRuns: 1
      WorkerType: G.1X
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: 60
      MaxRetries: 0
      DefaultArguments:
        '--job-language': python
        '--datalake-formats': iceberg
        '--enable-glue-datacatalog': 'true'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--extra-py-files': !Sub 's3://${ArtifactBucket}/${ArtifactPrefix}/lakehouse_src.zip'
        '--bucket': !Ref RawBucketName
        '--warehouse': !Sub 's3://${RawBucketName}/warehouse/'
        '--catalog': glue_catalog
        '--silver-database': !Ref SilverDatabase
        '--gold-database': !Ref GoldDatabase
        '--reference-dir': !Sub 's3a://${RawBucketName}/reference'
        '--snapshot-retention-days': '7'
        '--conf': !Sub 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://${RawBucketName}/warehouse/ --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO'
      Tags:
        Project: !Ref ProjectName
        Layer: Maintenance

  IngestionLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Financial ingestion Lambda reported one or more errors in a 5-minute period.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IngestionLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Financial ingestion Lambda was throttled in a 5-minute period.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IngestionLambdaHighDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Financial ingestion Lambda duration exceeded 4 minutes.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunctionName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 240000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  FinancialAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${ProjectName}-analytics'
      Description: Workgroup for querying the Financial Data Lakehouse Gold Iceberg tables.
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 10737418240
        EngineVersion:
          SelectedEngineVersion: 'Athena engine version 3'
        ResultConfiguration:
          OutputLocation: !Sub 's3://${RawBucketName}/athena-results/'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: Analytics

Outputs:
  SilverDatabaseName:
    Value: !Ref SilverDatabaseResource
  GoldDatabaseName:
    Value: !Ref GoldDatabaseResource
  BronzeToSilverJobName:
    Value: !Ref BronzeToSilverJob
  SilverToGoldJobName:
    Value: !Ref SilverToGoldJob
  IcebergMaintenanceJobName:
    Value: !Ref IcebergMaintenanceJob
  AthenaWorkGroupName:
    Value: !Ref FinancialAthenaWorkGroup
  IngestionLambdaErrorsAlarmName:
    Value: !Ref IngestionLambdaErrorsAlarm
  IngestionLambdaThrottlesAlarmName:
    Value: !Ref IngestionLambdaThrottlesAlarm
  IngestionLambdaHighDurationAlarmName:
    Value: !Ref IngestionLambdaHighDurationAlarm
